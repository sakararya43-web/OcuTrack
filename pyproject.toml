[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocutrack-analysis"
version = "0.1.0"
description = "OcuTrack ocular CV and temporal analysis engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.scripts]
ocutrack-analyze = "analysis.cli:main"

[tool.setuptools.packages.find]
include = ["analysis*"]
